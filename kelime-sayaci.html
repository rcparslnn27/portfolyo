<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kelime ve Karakter Sayacı - Metninizdeki kelime, karakter sayısını ve tahmini okuma süresini anında öğrenin.">
    <title>Kelime Sayacı - PratikCep</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .tool-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group textarea {
            width: 100%;
            height: 180px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            outline: none;
            resize: vertical;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 25px;
        }
        .stat-card {
            padding: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-align: center;
        }
        .stat-card h3 {
            font-size: 26px;
            color: var(--primary);
            margin-bottom: 5px;
            font-weight: 800;
        }
        .stat-card p {
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
        }
        .clear-btn {
            background: #d95d91;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: opacity 0.2s;
        }
        .clear-btn:hover {
            opacity: 0.9;
        }
        @media (max-width: 500px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="container navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">P</span>
            Pratik<span>Cep</span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Ana Sayfa</a>
            <a href="index.html#araclar">Araçlar</a>
            <a href="index.html#hakkimizda">Hakkımızda</a>
        </nav>

        <button id="themeToggle" class="theme-btn" aria-label="Temayı değiştir">
            ☾
        </button>
    </div>
</header>

<main class="container">
    <div class="tool-container">
        <h2>Kelime ve Karakter Sayacı</h2>
        <p style="color: var(--muted); margin-top: 5px; margin-bottom: 25px; font-size: 14px;">Metninizi aşağıdaki alana yazın veya yapıştırın.</p>
        
        <div class="form-group">
            <textarea id="textInput" placeholder="Metninizi buraya yazın..."></textarea>
        </div>

        <button class="clear-btn" id="clearTextBtn">Metni Temizle</button>

        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="wordCount">0</h3>
                <p>Kelime Sayısı</p>
            </div>
            <div class="stat-card">
                <h3 id="charCount">0</h3>
                <p>Karakter (Boşluk Dahil)</p>
            </div>
            <div class="stat-card">
                <h3 id="charNoSpaceCount">0</h3>
                <p>Karakter (Boşluksuz)</p>
            </div>
            <div class="stat-card">
                <h3 id="readingTime">0 sn</h3>
                <p>Tahmini Okuma Süresi</p>
            </div>
        </div>
    </div>
</main>

<script src="script.js"></script>
<script src="kelime-sayaci.js"></script>
</body>
</html>

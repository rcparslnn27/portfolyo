<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Şifre Oluşturucu - Güvenli ve güçlü rastgele şifreler oluşturun.">
    <title>Şifre Oluşturucu - PratikCep</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .tool-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        .password-display {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .password-display input {
            flex: 1;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            font-family: monospace;
            font-size: 16px;
            outline: none;
        }
        .copy-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .copy-btn:hover {
            opacity: 0.9;
        }
        .range-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .range-container input[type="range"] {
            flex: 1;
        }
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            cursor: pointer;
        }
        .checkbox-label input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }
        .calc-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .calc-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="container navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">P</span>
            Pratik<span>Cep</span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Ana Sayfa</a>
            <a href="index.html#araclar">Araçlar</a>
            <a href="index.html#hakkimizda">Hakkımızda</a>
        </nav>

        <button id="themeToggle" class="theme-btn" aria-label="Temayı değiştir">
            ☾
        </button>
    </div>
</header>

<main class="container">
    <div class="tool-container">
        <h2>Şifre Oluşturucu</h2>
        <p style="color: var(--muted); margin-top: 5px; margin-bottom: 25px; font-size: 14px;">Güçlü, güvenli ve özelleştirilebilir rastgele şifreler üretin.</p>
        
        <div class="password-display">
            <input type="text" id="passwordOutput" readonly placeholder="Şifreniz burada görünecek">
            <button class="copy-btn" id="copyPasswordBtn">Kopyala</button>
        </div>

        <div class="form-group">
            <label for="lengthRange">Şifre Uzunluğu: <span id="lengthValue">12</span></label>
            <div class="range-container">
                <input type="range" id="lengthRange" min="6" max="32" value="12">
            </div>
        </div>

        <div class="checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" id="includeUppercase" checked> Büyük Harfler (A-Z)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="includeLowercase" checked> Küçük Harfler (a-z)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="includeNumbers" checked> Rakamlar (0-9)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="includeSymbols" checked> Semboller (!@#$...)
            </label>
        </div>

        <button class="calc-btn" id="generatePasswordBtn">Yeni Şifre Oluştur</button>
    </div>
</main>

<script src="script.js"></script>
<script src="sifre-olusturucu.js"></script>
</body>
</html>

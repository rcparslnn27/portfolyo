<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fotoğraf Linkleyici</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e6e6e6;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .kutu {
      width: 92%;
      max-width: 460px;
      background: #1a1d27;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }
    h1 { margin-top: 0; font-size: 1.4rem; }
    
    #alan {
      display: block;
      border: 2px dashed #4a5070;
      border-radius: 12px;
      padding: 32px 12px;
      cursor: pointer;
      transition: .2s;
      user-select: none;
      position: relative;
    }
    #alan.uzerinde { border-color: #6c8cff; background: #20243a; }
    
    /* Input'u label içine aldık ve gizledik */
    #dosya {
      display: none;
    }

    #onizleme {
      max-width: 100%;
      max-height: 220px;
      margin-top: 16px;
      border-radius: 10px;
      display: none;
    }
    button {
      margin-top: 14px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #6c8cff;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #sonuc { margin-top: 16px; display: none; }
    #link {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333955;
      background: #0f1117;
      color: #e6e6e6;
    }
    #durum { margin-top: 10px; font-size: .9rem; color: #9aa3c7; }
  </style>
</head>
<body>
  <div class="kutu">
    <h1>📷 Fotoğraf Linkleyici</h1>

    <!-- Input'u label içerisine alarak tıklama sorununu kökten çözdük -->
    <label id="alan" for="dosya">
      Fotoğrafı buraya sürükle veya tıkla
      <input type="file" id="dosya" accept="image/*">
    </label>

    <img id="onizleme" alt="Önizleme">
    <br>
    <button type="button" id="yukle" disabled>Link oluştur</button>
    <div id="durum"></div>

    <div id="sonuc">
      <input id="link" readonly>
      <button type="button" id="kopyala">Kopyala</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const API_KEY = "66084a2ed26206677c6eb72f52220236";

      const ids = ["alan", "dosya", "onizleme", "yukle", "durum", "sonuc", "link", "kopyala"];
      const el = {};
      const eksik = [];

      ids.forEach((id) => {
        el[id] = document.getElementById(id);
        if (!el[id]) eksik.push(id);
      });

      if (eksik.length) {
        console.error("HTML'de bu ID'ler eksik:", eksik.join(", "));
        return;
      }

      let secilenDosya = null;
      let yukleniyor = false;

      async function yukle() {
        if (!secilenDosya || yukleniyor) return;

        yukleniyor = true;
        el.yukle.disabled = true;
        el.sonuc.style.display = "none";
        el.durum.textContent = "Yükleniyor...";

        const form = new FormData();
        form.append("image", secilenDosya);

        try {
          const res = await fetch("https://api.imgbb.com/1/upload?key=" + API_KEY, {
            method: "POST",
            body: form,
          });

          let veri;
          try {
            veri = await res.json();
          } catch (e) {
            throw new Error("Sunucudan geçersiz cevap geldi.");
          }

          if (!res.ok || !veri.success) {
            const mesaj = (veri.error && veri.error.message) || "HTTP " + res.status;
            throw new Error(mesaj);
          }

          el.link.value = veri.data.url;
          el.sonuc.style.display = "block";
          el.durum.textContent = "Hazır! ✅";
        } catch (err) {
          console.error("Yükleme hatası:", err);
          el.durum.textContent = "Hata: " + err.message + " (Yerel sunucudan çalıştırdığınızdan emin olun)";
        } finally {
          yukleniyor = false;
          el.yukle.disabled = false;
        }
      }

      function dosyaSec(dosya) {
        if (!dosya || !dosya.type.startsWith("image/")) {
          el.durum.textContent = "Lütfen geçerli bir görsel seç.";
          return;
        }
        if (dosya.size > 32 * 1024 * 1024) {
          el.durum.textContent = "Dosya 32 MB'den büyük olamaz.";
          return;
        }

        secilenDosya = dosya;
        el.onizleme.src = URL.createObjectURL(dosya);
        el.onizleme.style.display = "block";
        el.sonuc.style.display = "none";
        el.yukle.disabled = false;
        el.durum.textContent = dosya.name;

        yukle(); // Otomatik yükleme tetiklenir
      }

      el.dosya.addEventListener("change", (e) => {
        if (e.target.files && e.target.files[0]) {
          dosyaSec(e.target.files[0]);
          el.dosya.value = "";
        }
      });

      el.alan.addEventListener("dragover", (e) => {
        e.preventDefault();
        el.alan.classList.add("uzerinde");
      });
      el.alan.addEventListener("dragleave", () => el.alan.classList.remove("uzerinde"));
      el.alan.addEventListener("drop", (e) => {
        e.preventDefault();
        el.alan.classList.remove("uzerinde");
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          dosyaSec(e.dataTransfer.files[0]);
        }
      });

      document.addEventListener("paste", (e) => {
        const dosyalar = e.clipboardData ? e.clipboardData.files : [];
        if (dosyalar && dosyalar[0]) dosyaSec(dosyalar[0]);
      });

      el.yukle.addEventListener("click", yukle);

      el.kopyala.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(el.link.value);
        } catch (e) {
          el.link.select();
          document.execCommand("copy");
        }
        el.kopyala.textContent = "Kopyalandı ✓";
        setTimeout(() => (el.kopyala.textContent = "Kopyala"), 1500);
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fotoğraf Linkleyici</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e6e6e6;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .kutu {
      width: 92%;
      max-width: 460px;
      background: #1a1d27;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }
    h1 { margin-top: 0; font-size: 1.4rem; }
    #alan {
      border: 2px dashed #4a5070;
      border-radius: 12px;
      padding: 32px 12px;
      cursor: pointer;
      transition: .2s;
    }
    #alan.uzerinde { border-color: #6c8cff; background: #20243a; }
    #onizleme {
      max-width: 100%;
      max-height: 220px;
      margin-top: 16px;
      border-radius: 10px;
      display: none;
    }
    button {
      margin-top: 14px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #6c8cff;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #sonuc { margin-top: 16px; display: none; }
    #link {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333955;
      background: #0f1117;
      color: #e6e6e6;
    }
    #durum { margin-top: 10px; font-size: .9rem; color: #9aa3c7; }
  </style>
</head>
<body>
  <div class="kutu">
    <h1>📷 Fotoğraf Linkleyici</h1>

    <div id="alan">Fotoğrafı buraya sürükle veya tıkla</div>
    <input type="file" id="dosya" accept="image/*" hidden>

    <img id="onizleme" alt="Önizleme">
    <br>
    <button id="yukle" disabled>Link oluştur</button>
    <div id="durum"></div>

    <div id="sonuc">
      <input id="link" readonly>
      <button id="kopyala">Kopyala</button>
    </div>
  </div>

  <script src="foto-linkleyici.js"></script>
</body>
</html>

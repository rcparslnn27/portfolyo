<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KDV Hesaplama Aracı - KDV hariç ve dahil fiyatları kolayca hesaplayın.">
    <title>KDV Hesaplama - PratikCep</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .tool-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            outline: none;
        }
        .calc-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .calc-btn:hover {
            opacity: 0.9;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            display: none;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dashed var(--border);
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-item span:first-child {
            color: var(--muted);
            font-size: 14px;
        }
        .result-item span:last-child {
            font-weight: 700;
            color: var(--primary);
            font-size: 16px;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="container navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">P</span>
            Pratik<span>Cep</span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Ana Sayfa</a>
            <a href="index.html#araclar">Araçlar</a>
            <a href="index.html#hakkimizda">Hakkımızda</a>
        </nav>

        <button id="themeToggle" class="theme-btn" aria-label="Temayı değiştir">
            ☾
        </button>
    </div>
</header>

<main class="container">
    <div class="tool-container">
        <h2>KDV Hesaplama</h2>
        <p style="color: var(--muted); margin-top: 5px; margin-bottom: 25px; font-size: 14px;">Tutar ve KDV oranını seçerek hesaplama yapın.</p>
        
        <div class="form-group">
            <label for="amountInput">Tutar (₺)</label>
            <input type="number" id="amountInput" placeholder="Örn: 1000" min="0" step="any">
        </div>

        <div class="form-group">
            <label for="vatRate">KDV Oranı</label>
            <select id="vatRate">
                <option value="20">%20 (Genel Oran)</option>
                <option value="10">%10 (Gıda / Hizmet)</option>
                <option value="1">%1 (Temel Gıda / Basın)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="calcType">Hesaplama Türü</label>
            <select id="calcType">
                <option value="haric">KDV Hariç -> Dahil</option>
                <option value="dahil">KDV Dahil -> Hariç</option>
            </select>
        </div>

        <button class="calc-btn" id="calculateVatBtn">Hesapla</button>

        <div class="result-box" id="vatResultBox">
            <div class="result-item">
                <span>KDV Hariç Tutar:</span>
                <span id="resExclVat">-</span>
            </div>
            <div class="result-item">
                <span>KDV Tutarı:</span>
                <span id="resVatAmount">-</span>
            </div>
            <div class="result-item">
                <span>KDV Dahil Toplam:</span>
                <span id="resInclVat">-</span>
            </div>
        </div>
    </div>
</main>

<script src="script.js"></script>
<script src="kdv-hesaplama.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Döviz Hesaplama - PratikCep</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="container navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">P</span>
            Pratik<span>Cep</span>
        </a>
        <nav class="nav-links">
            <a href="index.html#anasayfa">Ana Sayfa</a>
            <a href="index.html#araclar">Araçlar</a>
            <a href="index.html#hakkimizda">Hakkımızda</a>
        </nav>
        <button id="themeToggle" class="theme-btn" aria-label="Temayı değiştir">☾</button>
    </div>
  </header>

  <main style="display: flex; align-items: center; justify-content: center; min-height: 80vh; padding: 20px;">
    <div class="kutu" style="width: 100%; max-width: 600px; background: var(--card-bg, #ffffff); border-radius: 16px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);">
      <div style="margin-bottom: 24px;">
        <h1 style="font-size: 1.6rem; margin-bottom: 8px;">Döviz Hesaplama</h1>
        <p style="color: var(--muted, #666); font-size: 0.95rem;">Güncel kurlarla para birimlerini anında çevirin.</p>
      </div>

      <div style="margin-bottom: 20px;">
        <label for="miktar" style="display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 8px;">Miktar</label>
        <input type="number" id="miktar" value="100" min="0" step="any" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem;">
      </div>

      <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 24px;">
        <div style="flex: 1;">
          <label for="kaynak" style="display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 8px;">Çevrilecek</label>
          <select id="kaynak" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem; background: transparent;">
            <option value="USD">USD - Amerikan Doları</option>
            <option value="EUR">EUR - Euro</option>
            <option value="TRY" selected>TRY - Türk Lirası</option>
            <option value="GBP">GBP - İngiliz Sterlini</option>
            <option value="CAD">CAD - Kanada Doları</option>
            <option value="CHF">CHF - İsviçre Frangı</option>
          </select>
        </div>

        <button class="degistir-btn" id="degistir" title="Birimleri Değiştir" type="button" style="margin-top: 26px; background: transparent; border: 1px solid #ddd; border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem;">⇄</button>

        <div style="flex: 1;">
          <label for="hedef" style="display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 8px;">Sonuç</label>
          <select id="hedef" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem; background: transparent;">
            <option value="USD" selected>USD - Amerikan Doları</option>
            <option value="EUR">EUR - Euro</option>
            <option value="TRY">TRY - Türk Lirası</option>
            <option value="GBP">GBP - İngiliz Sterlini</option>
            <option value="CAD">CAD - Kanada Doları</option>
            <option value="CHF">CHF - İsviçre Frangı</option>
          </select>
        </div>
      </div>

      <div class="sonuc-kutusu" style="background: var(--bg-secondary, #f8f9fa); padding: 24px; border-radius: 12px; text-align: center; border: 1px solid #eee;">
        <div class="sonuc-deger" id="sonucDeger" style="font-size: 1.8rem; font-weight: bold; color: var(--primary, #2563eb);">-</div>
        <div class="kur-bilgisi" id="kurBilgisi" style="font-size: 0.85rem; color: #666; margin-top: 8px;"></div>
      </div>

      <div id="durum" style="text-align: center; font-size: 0.85rem; color: #888; margin-top: 16px;">Kurlar yükleniyor...</div>
    </div>
  </main>

  <script src="zero.js"></script>
</body>
</html>

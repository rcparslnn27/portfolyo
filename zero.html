<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Döviz Hesaplama Aracı - Güncel kurlarla dolar, euro, sterlin ve diğer para birimlerini anında çevirin.">
    <title>Döviz Hesaplama - PratikCep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .tool-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
        }
        .tool-desc {
            color: var(--muted);
            margin-top: 5px;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            color-scheme: light dark;
            font-family: inherit;
            font-size: 15px;
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.25);
        }
        .row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 12px;
            align-items: end;
        }
        .swap-btn {
            margin-bottom: 20px;
            width: 46px;
            height: 46px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
        }
        .swap-btn:hover { border-color: var(--primary); }
        .result-box {
            margin-top: 10px;
            padding: 20px;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .result-main {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            word-break: break-word;
        }
        .result-sub {
            margin-top: 8px;
            color: var(--muted);
            font-size: 14px;
        }
        .status {
            margin-top: 14px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }
        .error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
        }
        @media (max-width: 520px) {
            .row { grid-template-columns: 1fr; }
            .swap-btn { margin: 0 0 20px; width: 100%; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="container navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">P</span>
            Pratik<span>Cep</span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Ana Sayfa</a>
            <a href="index.html#araclar">Araçlar</a>
            <a href="index.html#hakkimizda">Hakkımızda</a>
        </nav>

        <button id="themeToggle" class="theme-btn" type="button" aria-label="Temayı değiştir">
            ☾
        </button>
    </div>
</header>

<main class="container">
    <div class="tool-container">
        <h2>Döviz Hesaplama</h2>
        <p class="tool-desc">Güncel kurlarla para birimlerini anında çevirin.</p>

        <div class="form-group">
            <label for="amount">Miktar</label>
            <input type="number" id="amount" value="1" min="0" step="any" inputmode="decimal">
        </div>

        <div class="row">
            <div class="form-group">
                <label for="fromCur">Çevrilecek</label>
                <select id="fromCur"></select>
            </div>

            <button class="swap-btn" id="swapBtn" type="button" aria-label="Para birimlerini değiştir">⇄</button>

            <div class="form-group">
                <label for="toCur">Sonuç</label>
                <select id="toCur"></select>
            </div>
        </div>

        <div class="result-box" aria-live="polite">
            <div class="result-main" id="resultMain">-</div>
            <div class="result-sub" id="resultSub"></div>
        </div>

        <p class="error-msg" id="errorMsg" role="alert"></p>
        <p class="status" id="status">Kurlar yükleniyor...</p>
    </div>
</main>

<script src="script.js" defer></script>
<script src="doviz-hesaplama.js" defer></script>
</body>
</html>
